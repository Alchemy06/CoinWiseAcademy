workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verify

default:
  interruptible: true

frontend:test:
  stage: verify
  image: node:22-bullseye
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci
    - npm test

frontend:build:
  stage: verify
  image: node:22-bullseye
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci
    - npm run build

backend:check:
  stage: verify
  image: python:3.13-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/backend/.cache/pip"
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - backend/.cache/pip/
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python manage.py check
    - python manage.py makemigrations --check --dry-run

backend:test:
  stage: verify
  image: python:3.13-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/backend/.cache/pip"
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - backend/.cache/pip/
  script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python manage.py test
